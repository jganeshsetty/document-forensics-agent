name: Production Deployment Pipeline

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  deploy-backend-render:
    name: Trigger Render Backend Deployment
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Render via Webhook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Triggering Render auto-deploy hook..."
            curl -X POST "$RENDER_DEPLOY_HOOK"
            echo "Render deploy hook triggered."
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not set. Skipping automatic trigger (Render Git auto-deploy will handle if connected)."
          fi

  deploy-frontend-vercel:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: deploy-backend-render
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "Deploying frontend to Vercel production..."
            npm install -g vercel
            cd frontend
            vercel --prod --token="$VERCEL_TOKEN" --yes
          else
            echo "VERCEL_TOKEN secret not set. Vercel native GitHub integration will automatically build and deploy."
          fi

